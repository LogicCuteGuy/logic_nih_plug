[package]
name = "logic_nih_plug_gui"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["gui", "ui", "components"]
description = "GUI components ported from JUCE for nih-plug"
repository = "https://github.com/LogicCuteGuy/logic_nih_plug"

[features]
default = ["components"]
components = []
layout = []
graphics = ["logic_nih_plug_graphics/primitives"]
text = ["logic_nih_plug_graphics/text", "graphics"]
full = ["components", "layout", "graphics", "text"]

# Optional helper that opens a softbuffer-backed window and runs a draw callback. This
# makes it easy to prototype UIs or implement editors in examples without copying baseview
# plumbing everywhere. This is intentionally optional and feature-gated to avoid pulling
# additional dependencies into consumers that don't need it.
softbuffer-editor = ["baseview", "softbuffer", "raw-window-handle", "raw-window-handle-06"]
gl-editor = ["baseview", "glow", "raw-window-handle"]

[dependencies]
logic_nih_plug_graphics = { path = "../logic_nih_plug_graphics" }
thiserror = "2.0"
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0", optional = true, features = ["opengl"] }
softbuffer = { version = "0.4", optional = true }
raw-window-handle = { version = "0.5", optional = true }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6", optional = true }
glow = { version = "0.17", optional = true }

[dev-dependencies]
proptest = "1.8"
criterion = "0.8.2"

[[bench]]
name = "gui_benchmarks"
harness = false
