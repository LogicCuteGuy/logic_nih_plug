[package]
name = "logic_nih_plug_dsp"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["audio", "dsp", "plugin"]
description = "Digital signal processing algorithms ported from JUCE for nih-plug"
repository = "https://github.com/LogicCuteGuy/logic_nih_plug"

[features]
default = ["filters", "oscillators"]
filters = []
oscillators = []
convolution = ["dep:rustfft"]
envelopes = []
smoothing = []
processors = ["dynamics", "reverb", "delay", "modulation", "mixer", "pitch", "resampling"]
dynamics = []
reverb = []
delay = []
modulation = []
mixer = []
pitch = ["dep:rustfft"]
resampling = []
analysis = ["dep:rustfft"]
simd = []
full = ["filters", "oscillators", "convolution", "envelopes", "smoothing", "processors", "dynamics", "reverb", "delay", "modulation", "mixer", "pitch", "resampling", "analysis", "simd"]


[dependencies]
logic_nih_plug = { path = "..", default-features = false }
thiserror = "2.0.18"
rustfft = { version = "6.4", optional = true }
num-complex = "0.4"

[dev-dependencies]
proptest = "1.8"
criterion = "0.8.2"

[[bench]]
name = "dsp_benchmarks"
harness = false
