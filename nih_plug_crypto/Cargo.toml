[package]
name = "nih_plug_crypto"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["cryptography", "hashing", "encryption"]
description = "Cryptography utilities ported from JUCE for nih-plug"
repository = "https://github.com/robbert-vdh/nih-plug"

[features]
default = ["hashing", "encoding", "random"]
hashing = ["dep:md-5", "dep:sha2"]
encryption = ["dep:rsa", "dep:blowfish", "dep:cipher", "dep:rand", "dep:sha2"]
encoding = []
random = []
signatures = ["encryption"]
full = ["hashing", "encryption", "encoding", "random", "signatures"]

[dependencies]
thiserror = "1.0"
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
blowfish = { version = "0.9", optional = true }
cipher = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
base64 = "0.21"
getrandom = "0.2"

[dev-dependencies]
proptest = "1.4"
hex = "0.4"
