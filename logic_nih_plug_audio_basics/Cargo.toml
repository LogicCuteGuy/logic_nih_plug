[package]
name = "logic_nih_plug_audio_basics"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["audio", "midi", "plugin", "juce-port"]
description = "Audio buffer / channel-set / MIDI message primitives ported from JUCE for nih-plug"
repository = "https://github.com/LogicCuteGuy/logic_nih_plug"

[features]
# The default surface covers both the audio buffer half and the MIDI half,
# since almost every consumer of this crate wants both.
default = ["buffer", "midi"]

# `AudioSampleBuffer` + `AudioChannelSet` — JUCE `juce_audio_basics`'s audio side.
buffer = []

# `MidiMessage` + `MidiRPN` + `MidiClock` + `MTC` — JUCE `juce_audio_basics`'s MIDI side.
midi = []

# Equivalent to the default feature set.
full = ["buffer", "midi"]

[dependencies]
thiserror = "2.0.18"

[dev-dependencies]
# We round-trip MIDI bytes and audio samples through the public API in the unit
# tests. No external integration harness is needed.
