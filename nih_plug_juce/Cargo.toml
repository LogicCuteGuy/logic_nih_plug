[package]
name = "nih_plug_juce"
version = "0.1.0"
edition = "2021"
authors = ["NIH-plug Contributors"]
license = "ISC"
description = "JUCE GUI integration for nih-plug through FFI bindings"
repository = "https://github.com/robbert-vdh/nih-plug"

[dependencies]
cxx = "1.0"
thiserror = "1.0"

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"

[lib]
name = "nih_plug_juce"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ffi_benchmarks"
harness = false
