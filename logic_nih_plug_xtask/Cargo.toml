[package]
name = "logic_nih_plug_xtask"
version = "0.1.0"
edition = "2021"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
description = "NIH-plug's cargo xtask command, as a library"
license = "ISC"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23.1"
goblin = "0.10.7"
# Version 0.1.3 from crates.io assumes a 64-bit toolchain
reflink = { git = "https://github.com/nicokoch/reflink.git", rev = "e8d93b465f5d9ad340cd052b64bbc77b8ee107e2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
