[package]
name = "note_expressions"
version = "0.1.0"
edition = "2021"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

description = "Example plugin demonstrating polyphonic note expression events (PolyTuning, PolyVolume, PolyPan, PolyVibrato, PolyPressure, PolyBrightness, PolyExpression)"

[lib]
crate-type = ["cdylib"]

[dependencies]
logic_nih_plug = { path = "../../../", features = ["assert_process_allocs"] }
logic_nih_plug_dsp = { path = "../../../logic_nih_plug_dsp", features = ["oscillators", "filters"] }