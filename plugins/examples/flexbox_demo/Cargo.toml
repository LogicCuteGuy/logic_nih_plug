[package]
name = "flexbox_demo"
version = "0.1.0"
edition = "2021"
authors = ["NIH-plug Contributors"]
license = "ISC"

description = "Example demonstrating FlexBox layout system with interactive controls"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
logic_nih_plug = { path = "../../../", features = ["standalone"] }
logic_nih_plug_gui = { path = "../../../logic_nih_plug_gui", features = ["gl-editor", "layout"] }
logic_nih_plug_graphics = { path = "../../../logic_nih_plug_graphics" }

atomic_float = "1.1"
crossbeam = "0.8"
