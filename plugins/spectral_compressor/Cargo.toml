[package]
name = "spectral_compressor"
version = "0.4.3"
edition = "2021"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/LogicCuteGuy/logic_nih_plug/tree/master/plugins/spectral_compressor"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
logic_nih_plug = { path = "../../", features = ["assert_process_allocs", "standalone"] }
logic_nih_plug_vizia = { path = "../../logic_nih_plug_vizia" }

realfft = "3.5"

# For the GUI
atomic_float = "1.1"
crossbeam = "0.8"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
triple_buffer = "9.0"
