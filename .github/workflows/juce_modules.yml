name: JUCE Modules CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'nih_plug_dsp/**'
      - 'nih_plug_audio_formats/**'
      - 'nih_plug_data/**'
      - 'nih_plug_graphics/**'
      - 'nih_plug_gui/**'
      - 'nih_plug_osc/**'
      - 'nih_plug_crypto/**'
      - 'nih_plug_animation/**'
      - 'nih_plug_midi_ci/**'
      - '.github/workflows/juce_modules.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'nih_plug_dsp/**'
      - 'nih_plug_audio_formats/**'
      - 'nih_plug_data/**'
      - 'nih_plug_graphics/**'
      - 'nih_plug_gui/**'
      - 'nih_plug_osc/**'
      - 'nih_plug_crypto/**'
      - 'nih_plug_animation/**'
      - 'nih_plug_midi_ci/**'
      - '.github/workflows/juce_modules.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test JUCE Modules
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build nih_plug_dsp
      run: cargo build --package nih_plug_dsp --all-features
    
    - name: Test nih_plug_dsp
      run: cargo test --package nih_plug_dsp --all-features
    
    - name: Build nih_plug_audio_formats
      run: cargo build --package nih_plug_audio_formats --all-features
    
    - name: Test nih_plug_audio_formats
      run: cargo test --package nih_plug_audio_formats --all-features
    
    - name: Build nih_plug_data
      run: cargo build --package nih_plug_data --all-features
    
    - name: Test nih_plug_data
      run: cargo test --package nih_plug_data --all-features
    
    - name: Build nih_plug_graphics
      run: cargo build --package nih_plug_graphics --all-features
    
    - name: Test nih_plug_graphics
      run: cargo test --package nih_plug_graphics --all-features
    
    - name: Build nih_plug_gui
      run: cargo build --package nih_plug_gui --all-features
    
    - name: Test nih_plug_gui
      run: cargo test --package nih_plug_gui --all-features
    
    - name: Build nih_plug_osc
      run: cargo build --package nih_plug_osc --all-features
    
    - name: Test nih_plug_osc
      run: cargo test --package nih_plug_osc --all-features
    
    - name: Build nih_plug_crypto
      run: cargo build --package nih_plug_crypto --all-features
    
    - name: Test nih_plug_crypto
      run: cargo test --package nih_plug_crypto --all-features
    
    - name: Build nih_plug_animation
      run: cargo build --package nih_plug_animation --all-features
    
    - name: Test nih_plug_animation
      run: cargo test --package nih_plug_animation --all-features
    
    - name: Build nih_plug_midi_ci
      run: cargo build --package nih_plug_midi_ci --all-features
    
    - name: Test nih_plug_midi_ci
      run: cargo test --package nih_plug_midi_ci --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Run clippy on JUCE modules
      run: |
        cargo clippy --package nih_plug_dsp --all-features -- -D warnings
        cargo clippy --package nih_plug_audio_formats --all-features -- -D warnings
        cargo clippy --package nih_plug_data --all-features -- -D warnings
        cargo clippy --package nih_plug_graphics --all-features -- -D warnings
        cargo clippy --package nih_plug_gui --all-features -- -D warnings
        cargo clippy --package nih_plug_osc --all-features -- -D warnings
        cargo clippy --package nih_plug_crypto --all-features -- -D warnings
        cargo clippy --package nih_plug_animation --all-features -- -D warnings
        cargo clippy --package nih_plug_midi_ci --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    
    - name: Check formatting
      run: cargo fmt --all -- --check

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run benchmarks (nih_plug_dsp)
      run: cargo bench --package nih_plug_dsp --no-fail-fast
      continue-on-error: true
    
    - name: Run benchmarks (nih_plug_audio_formats)
      run: cargo bench --package nih_plug_audio_formats --no-fail-fast
      continue-on-error: true
    
    - name: Run benchmarks (nih_plug_graphics)
      run: cargo bench --package nih_plug_graphics --no-fail-fast
      continue-on-error: true
