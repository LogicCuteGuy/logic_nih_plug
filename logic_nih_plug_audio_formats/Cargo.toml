[package]
name = "logic_nih_plug_audio_formats"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["LogicCuteGuy <contact@logiccuteguy.com>", "Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["audio", "wav", "aiff", "flac", "ogg"]
description = "Audio file format support ported from JUCE for nih-plug"
repository = "https://github.com/LogicCuteGuy/logic_nih_plug"

[features]
default = ["wav", "aiff"]
wav = ["dep:hound"]
aiff = []
flac = ["dep:claxon"]
ogg = ["dep:lewton"]
# Standard MIDI File (.mid/.smf) read/write plus a tempo-aware MidiFilePlayer.
# Adds a dependency on logic_nih_plug_audio_basics for the MidiMessage type.
midi = ["dep:logic_nih_plug_audio_basics"]
full = ["wav", "aiff", "flac", "ogg", "midi"]

[dependencies]
thiserror = "2.0"
hound = { version = "3.5", optional = true }
claxon = { version = "0.4", optional = true }
lewton = { version = "0.10", optional = true }
logic_nih_plug_audio_basics = { path = "../logic_nih_plug_audio_basics", default-features = false, features = ["midi"], optional = true }

[dev-dependencies]
proptest = "1.8"
criterion = "0.8.2"

[[bench]]
name = "audio_io_benchmarks"
harness = false
