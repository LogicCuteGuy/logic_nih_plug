[package]
name = "nih_plug_data"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

keywords = ["data", "tree", "undo"]
description = "Data structures ported from JUCE for nih-plug"
repository = "https://github.com/robbert-vdh/nih-plug"

[features]
default = ["valuetree"]
valuetree = ["dep:quick-xml"]
undo = []
full = ["valuetree", "undo"]

[dependencies]
thiserror = "1.0"
quick-xml = { version = "0.31", optional = true }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
proptest = "1.4"
